<!doctype html><html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="stylesheet" href="styles.css">
<title>Join Empire | Empire Ultimate</title></head><body>
<header class="site-header">
  <a class="brand" href="index.html" aria-label="Empire Ultimate home">
    <img class="brand-helmet" src="assets/images/empire-helmet-transparent.png" alt="">
    <span class="brand-type">
      <img class="brand-wordmark" src="assets/images/empire-wordmark-transparent.png" alt="Empire">
      <span class="brand-subtitle">ULTIMATE</span>
    </span>
  </a>
  <nav class="site-nav roster-nav">
    <a href="index.html">Home</a>
    <a href="roster.html">Roster</a>
    <a href="index.html#events">Schedule</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>
<main class="form-page">
  <section class="form-hero">
    <p class="section-label">Become Part of Empire</p>
    <h1>Join Empire</h1>
    <p>Tell us a little about the athlete. We’ll follow up with information about upcoming opportunities.</p>
  </section>
  <section class="form-panel">
    <form action="https://formsubmit.co/empireultimateclub@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="New Join Empire Submission">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_next" value="https://jefftsamuel.github.io/empireultimate/thanks.html">
      <input type="text" name="_honey" style="display:none">
      <input type="hidden" name="_captcha" value="true">
      <div class="form-grid">
        <label>Athlete Name<input type="text" name="Athlete Name" required></label>
        <label>Age<input type="number" name="Age" min="10" max="25" required></label>
        <label>Home Community<input type="text" name="Home Community" required></label>
        <label>Email Address<input type="email" name="email" required></label>
        <label>Phone Number<input type="tel" name="Phone Number"></label>
        <label>Current Team or School<input type="text" name="Current Team or School"></label>
        <label class="form-full">Ultimate Experience<textarea name="Ultimate Experience" rows="4" placeholder="Years played, teams, positions, tournaments, or anything else helpful."></textarea></label>
        <label class="form-full">Additional Information<textarea name="Additional Information" rows="4"></textarea></label>
      </div>
      <button class="button button-primary" type="submit">Submit Interest</button>
    </form>
  </section>
</main>
</body></html>
